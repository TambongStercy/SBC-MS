# Security plan Phase 8: kyc-worker for SBC PREPROD, on the secondary server
# (/etc/nginx/sites-available/preprod-kyc.sniperbusinesscenter.com). Only the main SBC server may
# call it; the worker also checks each request's HMAC signature. TLS added by certbot.
# Prod: same file with kyc.sniperbusinesscenter.com and the prod container's port.
server {
    listen 80;
    listen [::]:80;
    server_name preprod-kyc.sniperbusinesscenter.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        allow 207.180.242.122;   # main SBC server
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
    access_log /var/log/nginx/preprod-kyc.access.log;
    error_log /var/log/nginx/preprod-kyc.error.log warn;
}
