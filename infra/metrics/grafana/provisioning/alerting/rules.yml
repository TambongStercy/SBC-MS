# Generated by infra/metrics/make-grafana.py — edit there.
apiVersion: 1
groups:
- orgId: 1
  name: sbc
  folder: SBC
  interval: 1m
  rules:
  - uid: sbc-service-down
    title: Service injoignable
    condition: B
    for: 3m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.env }} {{ $labels.instance }} : Prometheus ne lit plus ses métriques depuis 3 min (service arrêté, nginx ou réseau).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job="sbc"}
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sbc-disk
    title: Disque presque plein
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Serveur principal, {{ $labels.path }} : disque utilisé à {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} (seuil 85 %).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (path) (1 - sbc_host_disk_free_bytes / sbc_host_disk_total_bytes)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.85
  - uid: sbc-memory
    title: Mémoire presque pleine
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Serveur principal : mémoire utilisée à {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} (seuil 90 %).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(1 - sbc_host_memory_available_bytes / sbc_host_memory_total_bytes)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
  - uid: sbc-5xx
    title: Erreurs serveur (5xx)
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} {{ $labels.service }} : {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} des requêtes finissent en erreur serveur depuis 10 min (seuil 2 %).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (env, service) (rate(sbc_http_request_duration_seconds_count{code="5xx"}[10m])) / sum by (env, service) (rate(sbc_http_request_duration_seconds_count[10m])) and on (env, service) sum by (env, service)
          (rate(sbc_http_request_duration_seconds_count[10m])) > 0.05
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.02
  - uid: sbc-money-slow
    title: Routes argent lentes
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} payment {{ $labels.route }} : p95 de {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} depuis 10 min (seuil 5 s).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.95, sum by (le, env, route) (rate(sbc_http_request_duration_seconds_bucket{service="payment", route=~".*(withdraw|payout|transactions|payments/intents).*"}[10m])))
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
  - uid: sbc-api-slow
    title: API lente
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} {{ $labels.service }} : p95 de {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} depuis 15 min (seuil 2 s).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.95, sum by (le, env, service) (rate(sbc_http_request_duration_seconds_bucket{route!="unmatched"}[10m])))
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: sbc-mongo-down
    title: MongoDB ne répond pas
    condition: B
    for: 3m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: MongoDB (prod et preprod) ne répond plus à user-service (serverStatus) depuis 3 min.
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(sbc_mongo_up)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sbc-mongo-cache
    title: Cache MongoDB saturé
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'MongoDB (prod et preprod) : cache WiredTiger rempli à {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} : les données de travail ne tiennent plus en mémoire.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(sbc_mongo_cache_bytes{kind="used"} / ignoring(kind) sbc_mongo_cache_bytes{kind="max"})
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.95
  - uid: sbc-event-loop
    title: Service saturé (boucle d’événements)
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} {{ $labels.service }} : la boucle Node prend {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} de retard (p99).'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sbc_nodejs_eventloop_lag_p99_seconds
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
  - uid: sbc-job-errors
    title: Tâche planifiée en échec
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} {{ $labels.service }} : la tâche {{ $labels.task }} a échoué {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} fois en 30 min.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum by (env, service, task) (increase(sbc_job_runs_total{result="error"}[30m]))
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: sbc-job-stale
    title: Tâche de nuit non faite
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.env }} {{ $labels.service }} : {{ $labels.task }} n’a pas réussi depuis plus de 26 h.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - sbc_job_last_success_timestamp_seconds{task=~"dormancy_nightly|ledger_check|finance_reconciliation|authenticator_adoption"}
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 93600
  - uid: sbc-backup-stale
    title: Sauvegarde en retard
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Sauvegarde {{ $labels.kind }} : aucune réussite depuis plus de 26 h.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - max by (kind) (sbc_backup_last_success_timestamp_seconds)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 93600
  - uid: sbc-backup-failed
    title: Sauvegarde en échec
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Sauvegarde {{ $labels.kind }} : la dernière exécution a échoué.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (kind) (sbc_backup_last_ok) + max by (kind) (sbc_backup_running)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sbc-restore-failed
    title: Test de restauration en échec
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'Test de restauration {{ $labels.kind }} : la sauvegarde ne se restaure pas correctement.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (kind) (sbc_restore_test_ok)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sbc-restore-stale
    title: Test de restauration trop ancien
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Test de restauration {{ $labels.kind }} : pas fait depuis plus de 35 jours.'
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - max by (kind) (sbc_restore_test_timestamp_seconds)
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3024000
