# Prometheus on the secondary server. Targets: the main server's metrics port (9101), one path per
# service and environment. `env` and `service` come from here (the path), never from the service.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: sbc
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/secrets/main-metrics.crt   # the main server's self-signed certificate
      server_name: sbc-main-metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["207.180.242.122:9101"]
        labels: { env: preprod, __metrics_path__: /preprod/gateway }
      - targets: ["207.180.242.122:9101"]
        labels: { env: preprod, __metrics_path__: /preprod/user }
      - targets: ["207.180.242.122:9101"]
        labels: { env: preprod, __metrics_path__: /preprod/payment }
      - targets: ["207.180.242.122:9101"]
        labels: { env: preprod, __metrics_path__: /preprod/support }
      - targets: ["207.180.242.122:9101"]
        labels: { env: preprod, __metrics_path__: /preprod/risk }
      # prod: same five with env: prod and /prod/<service>, once prod has the code and the token.
    relabel_configs:
      # one instance per path (all share host:port), named after the service
      - source_labels: [__metrics_path__]
        regex: /[a-z]+/([a-z]+)
        target_label: instance
        replacement: $1
    metric_relabel_configs:
      # The main server's disk/memory/load (from gateway) and MongoDB (from user-service) are the
      # same machine and database for prod and preprod: env="shared", the reporting side kept in
      # source_env so a prod and a preprod copy never collide.
      - source_labels: [__name__, env]
        regex: (sbc_host_.*|sbc_mongo_.*);(.*)
        target_label: source_env
        replacement: $2
      - source_labels: [__name__]
        regex: sbc_host_.*|sbc_mongo_.*
        target_label: env
        replacement: shared

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
