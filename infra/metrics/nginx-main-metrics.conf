# Metrics of the SBC services, for the Prometheus on the secondary server (Security plan item 10).
# MAIN server: /etc/nginx/sites-available/sbc-metrics. Its own port, its own self-signed certificate
# (Prometheus pins it), only the secondary server's IP; each service checks METRICS_TOKEN again.
# It does not go through Cloudflare, so monitoring still works when Cloudflare does not.
# Certificate (on the main server, once, 10 years; the .crt is copied to the secondary):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=sbc-main-metrics" \
#     -addext "subjectAltName=DNS:sbc-main-metrics" \
#     -keyout /etc/nginx/ssl/sbc-metrics.key -out /etc/nginx/ssl/sbc-metrics.crt
server {
    listen 9101 ssl;
    server_name sbc-main-metrics;
    ssl_certificate     /etc/nginx/ssl/sbc-metrics.crt;
    ssl_certificate_key /etc/nginx/ssl/sbc-metrics.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 169.58.159.177;   # secondary server (Prometheus)
    allow 127.0.0.1;
    deny all;

    access_log off;
    proxy_set_header Host localhost;
    proxy_read_timeout 10s;

    # preprod (pm2 *-preprod)
    location = /preprod/gateway { proxy_pass http://127.0.0.1:6000/metrics; }
    location = /preprod/user    { proxy_pass http://127.0.0.1:6001/metrics; }
    location = /preprod/payment { proxy_pass http://127.0.0.1:6003/metrics; }
    location = /preprod/support { proxy_pass http://127.0.0.1:6012/metrics; }
    location = /preprod/risk    { proxy_pass http://127.0.0.1:6013/metrics; }
    # prod (uncomment once prod runs the metrics code and has METRICS_TOKEN)
    # location = /prod/gateway { proxy_pass http://127.0.0.1:3000/metrics; }
    # location = /prod/user    { proxy_pass http://127.0.0.1:3001/metrics; }
    # location = /prod/payment { proxy_pass http://127.0.0.1:3003/metrics; }
    # location = /prod/support { proxy_pass http://127.0.0.1:3012/metrics; }
    # location = /prod/risk    { proxy_pass http://127.0.0.1:3013/metrics; }
    location / { return 404; }
}
