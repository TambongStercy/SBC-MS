# Grafana on the SECONDARY server: /etc/nginx/sites-available/grafana.sniperbusinesscenter.com
# The zone's DNS-only wildcard already points here; TLS by certbot (--nginx), like preprod-kyc.
# Grafana's own login is the door (strong admin password, its brute-force lockout on), so nginx
# adds a rate limit on the login and keeps everything else of the stack (Prometheus) unreachable.
limit_req_zone $binary_remote_addr zone=grafana_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name grafana.sniperbusinesscenter.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    client_max_body_size 2m;
    add_header Referrer-Policy same-origin always;

    location = /login {
        limit_req zone=grafana_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (websocket)
    location /api/live/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/grafana.access.log;
    error_log /var/log/nginx/grafana.error.log warn;
}
