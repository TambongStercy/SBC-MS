# Secondary server: /opt/kyc-<env>/ holds this file, .env (KYC_SHARED_SECRET, never printed) and data/.
# Listens on 127.0.0.1 only; nginx (allow main server IP) in front. OpenReplay goes first on this
# server, so both containers are capped.
# Since 2026-11-22 KYC runs entirely here: kyc-worker takes submissions and answers results,
# kyc-runner checks the queue (one batch a second, backfill 02:00–05:00 Douala). Both share
# data/kyc.sqlite (WAL). The runner reads KYC_PER_SECOND, KYC_NIGHT_FROM/TO,
# KYC_BACKFILL_ANYTIME, KYC_RETENTION_DAYS, KYC_EMAIL_VARIANT_POINTS from .env.
# Level 3 (ID + selfie, 2026-11-22): KYC_L3_KEY in .env encrypts the images; the runner reads the
# two OpenCV face models from ./models (read-only), see .env.example.
services:
  kyc-worker:
    build: ./src
    image: sbc/kyc-worker:${KYC_TAG:-local}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${KYC_PORT:-5201}:5201"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  kyc-runner:
    image: sbc/kyc-worker:${KYC_TAG:-local}
    depends_on: [kyc-worker]
    command: ["python", "-m", "app.runner"]
    restart: unless-stopped
    env_file: .env
    environment:
      KYC_MODELS_DIR: /models
      OPENCV_IO_MAX_IMAGE_PIXELS: "40000000"   # refuses decompression bombs
    volumes:
      - ./data:/data
      - ./models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
