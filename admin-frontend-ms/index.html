<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sbc-app-icon.png" />
    <link rel="apple-touch-icon" href="/sbc-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>SBC Admin</title>
    <script>
      // Apply the admin's theme before the first paint (no light flash in dark mode).
      try { if (localStorage.getItem('sbc-admin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
      /* The SBC loading screen while the app downloads (React replaces #root when it starts). */
      body { margin: 0; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #F8FAFC; color: #0F172A; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .dark .boot { background: #0B1220; color: #E2E8F0; }
      .boot p { margin: 0; }
      .boot-top { font-size: 16px; font-weight: 300; line-height: 16px; letter-spacing: .04em; }
      .boot-top::after { content: "\00a9"; font-size: 10px; position: relative; top: -5px; margin-left: 2px; }
      .boot-mid { font-size: 44px; font-weight: 800; line-height: 40px; letter-spacing: -.02em; }
      .boot-mid span { font-size: 22px; display: inline-block; vertical-align: top; color: #FF6821; margin: -6px 0 0 4px; }
      .boot-bottom { font-size: 28px; font-weight: 300; line-height: 30px; margin-left: 4px; }
      .boot-track { width: 150px; height: 12px; border: 2px solid #94A3B8; border-radius: 7px; padding: 2px 1px; overflow: hidden; font-size: 0; white-space: nowrap; }
      .boot-track span { width: 9px; height: 100%; margin-right: 2px; display: inline-block; border-radius: 2px;
        background: linear-gradient(to bottom, #2838c7 0%, #5979ef 17%, #869ef3 32%, #869ef3 45%, #5979ef 59%, #2838c7 100%);
        animation: boot-slide 2s linear infinite; }
      @keyframes boot-slide { from { transform: translateX(-30px); } to { transform: translateX(150px); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Chargement">
        <div style="width:230px">
          <p class="boot-top">SIMBTECH</p>
          <p class="boot-mid">Admin<span>SBC</span></p>
          <p class="boot-bottom">Professional</p>
        </div>
        <div class="boot-track" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
